name: lifeos
description: A calm life balance and burnout awareness Flutter MVP.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_messaging: ^15.1.5
  cloud_firestore: ^5.5.0
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  intl: ^0.20.1
  google_maps_flutter: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
